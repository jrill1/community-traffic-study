<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Corridor speed dashboard — 21 Aug 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1b1d22;
    --muted: #6a6f78;
    --faint: #9aa0a8;
    --line: #e6e3da;
    --surface: #ffffff;
    --page: #f6f4ee;
    --limit: #1a1a1a;
    --display: "Space Grotesk", system-ui, sans-serif;
    --body: "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 48px 24px 64px; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 10px;
  }
  h1 {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(28px, 4vw, 40px);
    letter-spacing: -0.01em;
    margin: 0 0 16px;
  }
  .sub { color: var(--muted); font-size: 15px; max-width: 56ch; margin: 0 0 36px; }

  .top-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; align-items: start; }
  .top-row > * { min-width: 0; }
  .top-row svg { display: block; width: 100%; align-self: start; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .stat .k { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; }
  .stat .v { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1; margin: 0; }
  .stat .note { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .stat.alert .v { color: #b1442e; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px 24px 28px;
  }
  .panel-header { display: flex; flex-direction: column; align-items: flex-start; margin: 0 0 14px; }
  .panel-header h2 { font-family: var(--display); font-weight: 500; font-size: 17px; margin: 0; }

  .dir-toggle { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

  .compare-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: 1px solid var(--line); border-radius: 20px;
    padding: 5px 14px; font-family: var(--body); font-size: 13px;
    color: var(--muted); cursor: pointer; transition: border-color 0.12s, color 0.12s, background 0.12s;
    white-space: nowrap;
  }
  .compare-btn:hover { border-color: var(--ink); color: var(--ink); }
  .compare-btn svg { flex-shrink: 0; }
  @keyframes compareGlow {
    0%   { box-shadow: 0 0 0 2.5px rgba(255,210,0,0.45),  7.5px  0    20px rgba(255,210,0,0.28); }
    25%  { box-shadow: 0 0 0 4px   rgba(255,210,0,0.64),  0      7.5px 20px rgba(255,210,0,0.35); }
    50%  { box-shadow: 0 0 0 2.5px rgba(255,210,0,0.45), -7.5px  0    20px rgba(255,210,0,0.28); }
    75%  { box-shadow: 0 0 0 4px   rgba(255,210,0,0.64),  0     -7.5px 20px rgba(255,210,0,0.35); }
    100% { box-shadow: 0 0 0 2.5px rgba(255,210,0,0.45),  7.5px  0    20px rgba(255,210,0,0.28); }
  }
  .compare-active { animation: compareGlow 2.4s linear infinite; }
  .dir-toggle button.compare-selected { background: rgba(255,210,0,0.85); color: var(--ink); }
  .preset-btn.compare-selected { background: rgba(255,210,0,0.85); color: var(--ink); border-color: rgba(200,163,0,0.6); }
  #compareCancelBtn {
    display: none; align-items: center; justify-content: center;
    width: 26px; height: 26px; padding: 0; flex-shrink: 0;
    background: none; border: 1px solid var(--line); border-radius: 6px;
    font-size: 15px; color: var(--muted); cursor: pointer;
    transition: border-color 0.12s, color 0.12s;
  }
  #compareCancelBtn:hover { border-color: var(--ink); color: var(--ink); }

  #dateCompareSelector {
    grid-column: 2; grid-row: 1;
    display: none; flex-direction: column; align-items: flex-start; justify-content: flex-start;
  }
  #dateCmpHeaderSpacer, #dateCmpPresetsSpacer { flex-shrink: 0; }
  #statsB { width: 100%; }
  #prevEndDayB, #endDateLabelB, #nextEndDayB, #spanCloseB { display: none; }
  #dateNavB.span-mode .span-btn { display: none; }
  #dateNavB.span-mode .span-sep { display: flex; }
  #dateNavB.span-mode .date-label-btn { width: 118px; }
  #dateNavB.span-mode #prevEndDayB,
  #dateNavB.span-mode #endDateLabelB,
  #dateNavB.span-mode #nextEndDayB,
  #dateNavB.span-mode #spanCloseB { display: flex; }

  .view-toggle { display: flex; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .view-toggle button {
    background: none;
    border: none;
    border-left: 1px solid var(--line);
    padding: 5px 16px;
    font-family: var(--body);
    font-size: 13px;
    cursor: pointer;
    color: var(--muted);
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }
  .view-toggle button:first-child { border-left: none; }
  .view-toggle button.active { background: var(--ink); color: #fff; }
  .view-toggle button:not(.active):hover { background: var(--page); }
  .dir-toggle button {
    flex: 1;
    text-align: center;
    background: none;
    border: none;
    border-left: 1px solid var(--line);
    padding: 5px 14px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.07em;
    cursor: pointer;
    color: var(--muted);
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }
  .dir-toggle button:first-child { border-left: none; }
  .dir-toggle button.active { background: var(--ink); color: #fff; }
  .dir-toggle button:not(.active):hover { background: var(--page); }
  .cycle-arrow { display: none; }

  .legend { display: flex; flex-wrap: nowrap; gap: 0 10px; margin: 0 0 16px; font-size: 11px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
  .dash { width: 18px; border-top: 2px dashed var(--limit); display: inline-block; }

  .chart-box { position: relative; width: 100%; height: 360px; }
  #noData {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: var(--display);
    font-size: 15px;
    color: var(--faint);
    pointer-events: none;
  }
  #noData.visible { display: flex; }

  @keyframes arrowFlicker {
    0%   { opacity: 0; }
    8%   { opacity: 1; }
    32%  { opacity: 0.04; }
    60%  { opacity: 1; }
    87%  { opacity: 0.04; }
    100% { opacity: 0; }
  }
  .dir-arrow { opacity: 0; fill: #FFE500; }
  .dir-arrow.animate { animation: arrowFlicker 2.4s ease-out forwards; }

  footer { margin-top: 28px; font-size: 13px; color: var(--faint); }
  footer code { font-family: var(--mono); background: #efece4; padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  /* ── Date navigator ─────────────────────────────────────────────── */
  .date-nav {
    display: flex;
    align-items: center;
    gap: 3px;
    margin: 0 0 8px;
    position: relative;
    flex-wrap: nowrap;
  }
  .date-step {
    width: 34px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 18px;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
    flex-shrink: 0;
    padding: 0;
  }
  .date-step:hover:not(:disabled) { background: var(--page); color: var(--ink); }
  .date-step:disabled { opacity: 0.28; cursor: default; }
  .date-label-btn {
    height: 38px;
    width: 152px;
    flex-shrink: 0;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: var(--display);
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    letter-spacing: -0.01em;
    transition: background 0.12s;
    white-space: nowrap;
  }
  .date-label-btn:hover { background: var(--page); }
  .date-dayname { color: var(--muted); }
  .date-dot { color: var(--faint); }
  #datePicker, #endDatePicker {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    width: 0;
    height: 0;
    border: none;
    padding: 0;
  }
  .span-btn {
    height: 38px;
    padding: 0 13px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: var(--body);
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
    flex-shrink: 0;
    margin-left: 5px;
  }
  .span-btn:hover { background: var(--page); color: var(--ink); }
  .span-sep {
    color: var(--faint);
    font-size: 15px;
    padding: 0 5px;
    display: none;
    align-items: center;
    flex-shrink: 0;
  }
  #prevEndDay, #endDateLabel, #nextEndDay, #spanClose { display: none; }
  .date-nav.span-mode .span-btn { display: none; }
  .date-nav.span-mode .span-sep { display: flex; }
  .date-nav.span-mode .date-label-btn { width: 118px; }
  .date-nav.span-mode #prevEndDay,
  .date-nav.span-mode #endDateLabel,
  .date-nav.span-mode #nextEndDay,
  .date-nav.span-mode #spanClose { display: flex; }
  .span-presets { visibility: hidden; display: flex; flex-wrap: nowrap; gap: 6px; margin: 0 0 20px; align-items: center; }
  .date-nav.span-mode + .span-presets { visibility: visible; }
  .preset-btn {
    height: 36px; padding: 0 13px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; font-family: var(--body); font-size: 13px;
    color: var(--ink); cursor: pointer; white-space: nowrap;
    transition: background 0.12s;
  }
  .preset-btn:hover { background: var(--page); }
  .preset-btn.active { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .preset-sep { width: 1px; height: 24px; background: var(--line); flex-shrink: 0; margin: 0 2px; }
  .date-primary { display: flex; align-items: center; gap: 3px; }

  /* ── Mobile ─────────────────────────────────────────────────────── */
  @media (max-width: 640px) {
    .wrap { padding: 22px 16px 48px; }
    .top-row { grid-template-columns: 3fr 7fr; column-gap: 16px; row-gap: 8px; margin-bottom: 16px; }
    .top-left { display: contents; }
    .eyebrow { font-size: 7.8px; margin: 0 0 -15px; grid-column: 1 / -1; }
    .top-row h1, .date-nav, .span-presets { grid-column: 1 / -1; }
    .top-row h1 { margin: 0 0 0px; }
    #dateCompareSelector { grid-column: 1 / -1; grid-row: auto; margin-top: 28px; }
    .date-nav { flex-wrap: wrap; row-gap: 6px; }
    .date-nav.span-mode { margin: 0 0 -3px; }
    .date-nav:not(.span-mode) { margin: 0 0 2px; }
    .date-primary { width: calc(50% - 35px); justify-content: flex-start; }
    #dateNav .date-primary .date-label-btn { width: auto; min-width: 0; flex-shrink: 1; flex-grow: 1; padding: 0 6px; font-size: 12px; }
    #dateNav .date-primary .date-step { width: 26px; flex-shrink: 0; }
    .span-presets { flex-wrap: nowrap; gap: 4px; justify-content: space-between; }
    .date-nav:not(.span-mode) + .span-presets { display: none; }
    .date-nav.span-mode + .span-presets { margin: 0 0 8px; }
    .preset-btn { padding: 0 8px; font-size: 10px; }
    .preset-sep { margin: 0 1px; }
    .legend { flex-wrap: nowrap; gap: 0 7px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .legend::-webkit-scrollbar { display: none; }
    .legend span { gap: 4px; flex-shrink: 0; }
    .legend .swatch { width: 9px; height: 9px; }
    .filter-row { flex-wrap: wrap; row-gap: 12px; }
    .chart-header-row { flex-wrap: wrap; row-gap: 10px; }
    #compareBtn { display: none; }
    .cycle-row { display: flex; align-items: center; gap: 4px; }
    .cycle-arrow {
      display: flex; align-items: center; justify-content: center;
      width: 20px; height: 24px; flex-shrink: 0; padding: 0;
      background: none; border: 1px solid var(--line); border-radius: 4px;
      font-size: 12px; color: var(--muted); cursor: pointer;
    }
    .dir-toggle button:not(.active) { display: none; }
    .dir-toggle button.active { border-left: none; }
    .panel { padding-left: 21.66px; padding-right: 21.66px; }
    #dirToggle button, #pathToggle button, #parkingToggle button { font-size: 0; }
    #dirToggle button::after, #pathToggle button::after, #parkingToggle button::after { content: attr(data-short); font-size: 11px; }
    .legend .mph-suffix { display: none; }
    .stats { grid-template-columns: 1fr; }
    .stat { padding: 11.088px 14px; }
    .stat .k { font-size: 7.15px; margin: 0 0 7.392px; }
    .stat .v { font-size: 20px; }
    .stat .note { font-size: 7px; margin: 5.544px 0 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <div class="top-left">
      <p class="eyebrow">Speed survey · sensor 01</p>
      <h1>Oakland Rd traffic</h1>

      <div class="date-nav" id="dateNav">
        <div class="date-primary">
          <button class="date-step" id="prevDay" aria-label="Previous day">&#8249;</button>
          <button class="date-label-btn" id="dateLabel" aria-label="Pick a date">
            <span class="date-dayname" id="dateDayname"></span><span class="date-dot">·</span><span id="dateFmt"></span>
          </button>
          <button class="date-step" id="nextDay" aria-label="Next day">&#8250;</button>
        </div>
        <input type="date" id="datePicker" tabindex="-1" aria-hidden="true" />
        <button class="span-btn" id="spanToggle" aria-label="Expand to date range">&#8594;&#124; <span>Span</span></button>
        <span class="span-sep" aria-hidden="true">&#8594;</span>
        <div class="date-primary">
          <button class="date-step" id="prevEndDay" aria-label="Previous end day">&#8249;</button>
          <button class="date-label-btn" id="endDateLabel" aria-label="Pick end date">
            <span class="date-dayname" id="endDateDayname"></span><span class="date-dot">·</span><span id="endDateFmt"></span>
          </button>
          <button class="date-step" id="nextEndDay" aria-label="Next end day">&#8250;</button>
        </div>
        <input type="date" id="endDatePicker" tabindex="-1" aria-hidden="true" />
        <button class="date-step" id="spanClose" aria-label="Collapse to single day">&#215;</button>
      </div>
      <div class="span-presets" id="spanPresets">
        <button class="preset-btn" data-days="7">7 days</button>
        <button class="preset-btn" data-days="14">14 days</button>
        <button class="preset-btn" data-days="30">30 days</button>
        <span class="preset-sep"></span>
        <button class="preset-btn daytype-btn" data-daytype="weekdays">Weekdays</button>
        <button class="preset-btn daytype-btn" data-daytype="weekends">Weekends</button>
      </div>

      <div class="stats" id="stats"></div>
    </div>
    <svg id="neighborhoodMap" width="100%" viewBox="0 0 680 485" xmlns="http://www.w3.org/2000/svg">

      <g>
        <polygon points="650,22 644,38 656,38" fill="#5F5E5A"/>

      </g>
      <!-- W←E (etw) arrows: straight + turning movements -->
      <g id="etw-arrows" aria-hidden="true">
        <path class="dir-arrow path-straight" transform="translate(252,218) rotate(197.7)" d="M 13 0 L 2 -6 L 2 -2.5 L -10 -2.5 L -10 2.5 L 2 2.5 L 2 6 Z"/>

    for (const path of ['all','straight','turning'])
      for (const parking of ['all','parked','clear'])
        COUNTS[`${dir}_${path}_${parking}`] = merge(...leafKeys(dir, path, parking));
}

function merge(...keys) {
  return LEAF[keys[0]].map((row, bi) =>
    row.map((_, h) => keys.reduce((s, k) => s + LEAF[k][bi][h], 0))
  );
}

function leafKeys(dir, path, parking) {
  const dirs   = dir     === 'both' ? ['etw','wte']          : [dir];
  const paths  = path    === 'all'  ? ['straight','turning'] : [path];
  const parks  = parking === 'all'  ? ['parked','clear']     : [parking];
  return dirs.flatMap(d => paths.flatMap(p => parks.map(pk => `${d}_${p}_${pk}`)));
}

const LIMIT_MPH = 25;
const LIMIT_BAND_INDEX = BANDS.findIndex(b => b.name.endsWith('25'));

let currentDate    = AVAILABLE_DATES[AVAILABLE_DATES.length - 1];
let currentDir     = 'both';
let currentPath    = 'all';
let currentParking = 'all';
let isSpanMode     = false;
let endDate        = currentDate;
let currentDayType = 'all'; // 'all' | 'weekdays' | 'weekends'
let isCompareMode     = false;
let compareDimension  = null; // 'direction' | 'path' | 'parking' | 'date'

let compareEndDateB   = null;

const COMPARE_COLOR_A = '#4a82dc';
const COMPARE_COLOR_B = '#d68526';

/* ── helpers ───────────────────────────────────────────────────── */
const sumArr = arr => arr.reduce((a, c) => a + c, 0);

function getActiveDates() {
  let dates = AVAILABLE_DATES.filter(d => d >= currentDate && d <= endDate);
  if (currentDayType === 'weekdays') {
    dates = dates.filter(d => { const [y,m,dy] = d.split('-').map(Number); const dow = new Date(y,m-1,dy).getDay(); return dow >= 1 && dow <= 5; });
  } else if (currentDayType === 'weekends') {
    dates = dates.filter(d => { const [y,m,dy] = d.split('-').map(Number); const dow = new Date(y,m-1,dy).getDay(); return dow === 0 || dow === 6; });
  }
  return dates;
}

function computeYMax() {
  if (isSpanMode) {
    const active = getActiveDates();
    if (!active.length) return 10;
    const perHour = Array(24).fill(0);
    active.forEach(dateStr => {
      const lf = ALL_LEAVES[dateStr];
      ['etw_straight_all','etw_turning_all','wte_straight_all','wte_turning_all'].forEach(k =>
        lf[k].forEach(row => row.forEach((v, h) => { perHour[h] += v; }))
      );
    });
    return Math.max(10, ...perHour);
  }
  if (!AVAILABLE_DATES.includes(currentDate)) return 10;
  return Math.max(10, ...Array.from({length: 24}, (_, h) =>
    COUNTS['both_all_all'].reduce((s, row) => s + row[h], 0)
  ));
}

function getSpanDataForDayType(daytype, dir, path, parking) {
  const isWknd = d => { const [y,m,dy] = d.split('-').map(Number); const dow = new Date(y,m-1,dy).getDay(); return dow === 0 || dow === 6; };
  const dates = AVAILABLE_DATES.filter(d => d >= currentDate && d <= endDate && (daytype === 'weekends' ? isWknd(d) : !isWknd(d)));
  if (!dates.length) return BANDS.map(b => ({ ...b, counts: Array(24).fill(0) }));
  const dirs  = dir  === 'both' ? ['etw','wte']          : [dir];
  const paths = path === 'all'  ? ['straight','turning'] : [path];
  const summed = BANDS.map(() => Array(24).fill(0));
  dates.forEach(dateStr => {
    const lf = ALL_LEAVES[dateStr];
    if (!lf) return;
    dirs.forEach(d => paths.forEach(p => {
      const allB = lf[`${d}_${p}_all`];
      const pkdB = lf[`${d}_${p}_parked`];
      const src  = parking === 'all'    ? allB
                 : parking === 'parked' ? pkdB
                 : allB.map((row, bi) => row.map((v, h) => v - pkdB[bi][h]));
      src.forEach((row, bi) => row.forEach((v, h) => { summed[bi][h] += v; }));
    }));
  });
  return BANDS.map((b, bi) => ({ ...b, counts: summed[bi] }));
}

  if (!active.length) return BANDS.map(b => ({ ...b, counts: Array(24).fill(0) }));

                  : allB.map((row, bi) => row.map((v, h) => v - pkdB[bi][h]));

  active.forEach(dateStr => {

                  : allB.map((row, bi) => row.map((v, h) => v - pkdB[bi][h]));

    }));

function getSpeedData(dir, path, parking) {

  return BANDS.map((b, i) => ({ ...b, counts: matrix[i] }));
}

function getSpeedDataForDate(dateStr, dir, path, parking) {
  const lf = ALL_LEAVES[dateStr];
  if (!lf) return BANDS.map(b => ({ ...b, counts: Array(24).fill(0) }));
  const dirs  = dir  === 'both' ? ['etw','wte']          : [dir];

  const summed = BANDS.map(() => Array(24).fill(0));
  dirs.forEach(d => paths.forEach(p => {

               : parking === 'parked' ? pkdB
               : allB.map((row, bi) => row.map((v, h) => v - pkdB[bi][h]));
    src.forEach((row, bi) => row.forEach((v, h) => { summed[bi][h] += v; }));
  }));
  return BANDS.map((b, bi) => ({ ...b, counts: summed[bi] }));

/* ── stats ─────────────────────────────────────────────────────── */
function renderStats(dir, path, parking) {
  const statsEl = document.getElementById('stats');
  statsEl.innerHTML = '';
  let cards;
  const active = isSpanMode ? getActiveDates() : null;
  const noData = isSpanMode ? active.length === 0 : !AVAILABLE_DATES.includes(currentDate);
  if (noData) {
    cards = [
      { k: 'Events counted', v: 'N/A', note: 'no data for this ' + (isSpanMode ? 'range' : 'date') },
      { k: 'Over the limit', v: 'N/A', note: 'no data for this ' + (isSpanMode ? 'range' : 'date') },
    ];
  } else if (isSpanMode) {
    const data = getSpanSpeedData(dir, path, parking);
    const spanTotal = data.reduce((a, b) => a + sumArr(b.counts), 0);
    const spanOver  = data.slice(LIMIT_BAND_INDEX + 1).reduce((a, b) => a + sumArr(b.counts), 0);
    const pctOver   = spanTotal ? Math.round((spanOver / spanTotal) * 100) : 0;
    const n = active.length;
    cards = [
      { k: 'Events counted', v: spanTotal, note: n + (n === 1 ? ' day' : ' days') + ' total' },
      { k: 'Over the limit', v: pctOver + '%', note: spanOver + ' of ' + spanTotal + ' traffic events', alert: true },
    ];
  } else {
    const data = getSpeedData(dir, path, parking);
    const total = data.reduce((a, b) => a + sumArr(b.counts), 0);
    const overLimit = data.slice(LIMIT_BAND_INDEX + 1).reduce((a, b) => a + sumArr(b.counts), 0);
    const pctOver = total ? Math.round((overLimit / total) * 100) : 0;
    cards = [
      { k: 'Events counted', v: total, note: '\u2265 10 mph, full day' },
      { k: 'Over the limit', v: pctOver + '%', note: overLimit + ' of ' + total + ' traffic events', alert: true },
    ];
  }
  cards.forEach(s => {
    const el = document.createElement('div');
    el.className = 'stat' + (s.alert ? ' alert' : '');
    el.innerHTML = '<p class="k">' + s.k + '</p><p class="v">' + s.v + '</p><p class="note">' + s.note + '</p>';
    statsEl.appendChild(el);
  });
}

/* ── legend ────────────────────────────────────────────────────── */
function renderLegend(dir, path, parking) {
  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = '';
  legendEl.style.flexDirection = '';
  legendEl.style.gap = '';
  if (isCompareMode && compareDimension) {
    const labels = {
      direction: ['W ← E', 'W → E'],
      path:      ['Straight', 'Turning'],
      parking:   ['Clear', 'Parked nearby'],
      date:      [
        isSpanMode && endDate && endDate !== currentDate
          ? parseDateLabel(currentDate).fullLabel + '–' + parseDateLabel(endDate).fullLabel
          : (currentDate ? parseDateLabel(currentDate).fullLabel : ''),
        isSpanModeB && compareEndDateB && compareEndDateB !== compareDateB
          ? parseDateLabel(compareDateB).fullLabel + '–' + parseDateLabel(compareEndDateB).fullLabel
          : (compareDateB ? parseDateLabel(compareDateB).fullLabel : ''),
      ],
      daytype:   ['Weekdays', 'Weekends'],
    }[compareDimension];
    if (currentView !== 'hour') {
      // Full Day compare: one row — solid swatches + label A, then faded+outlined swatches + label B
      [BANDS, BANDS].forEach((bands, i) => {
        const group = document.createElement('span');
        group.style.cssText = 'display:flex;align-items:center;gap:3px;';
        bands.forEach((b, bi) => {
          const sw = document.createElement('span');
          sw.className = 'swatch';
          if (i === 0) {
            sw.style.background = b.color;
          } else {
            sw.style.background = BAND_COLORS_B[bi];
            sw.style.border = `1.5px solid ${b.color}`;
            sw.style.boxSizing = 'border-box';
          }
          group.appendChild(sw);
        });
        const lbl = document.createElement('span');
        lbl.style.marginLeft = '6px';
        lbl.textContent = labels[i];
        group.appendChild(lbl);
        legendEl.appendChild(group);
      });
      return;
    }
    // By Hour compare: single blue/orange swatch per dataset
    [COMPARE_COLOR_A, COMPARE_COLOR_B].forEach((color, i) => {
      const el = document.createElement('span');
      el.innerHTML = `<span class="swatch" style="background:${color}"></span>${labels[i]}`;
      legendEl.appendChild(el);
    });
    return;
  }
  getSpeedData(dir, path, parking).forEach(b => {
    if (!sumArr(b.counts)) return;
    const el = document.createElement('span');
    el.innerHTML = '<span class="swatch" style="background:' + b.color + '"></span>' + b.name + '<span class="mph-suffix"> mph</span>';
    legendEl.appendChild(el);
  });
}

/* ── date nav ──────────────────────────────────────────────────── */
function parseDateLabel(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const day = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()];
  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()];
  return { day, label: mon + '\u00a0' + d, fullLabel: d + ' ' + mon + ' ' + y };
}

function addDays(dateStr, delta) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d + delta);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

function renderDateNav() {
  const { day, label, fullLabel } = parseDateLabel(currentDate);
  document.getElementById('dateDayname').textContent = day;
  document.getElementById('dateFmt').textContent = label;
  document.getElementById('prevDay').disabled = currentDate <= AVAILABLE_DATES[0];
  document.getElementById('nextDay').disabled = isSpanMode
    ? currentDate >= endDate
    : currentDate >= AVAILABLE_DATES[AVAILABLE_DATES.length - 1];


  if (isSpanMode) {
    const active = getActiveDates();
    const totalEv = active.reduce((s, d) => s + (DATE_STATS[d] ? DATE_STATS[d].total : 0), 0);
    const { fullLabel: endFull } = parseDateLabel(endDate);
    document.getElementById('footerDate').textContent = fullLabel + ' \u2013 ' + endFull + ', ';
    document.getElementById('footerStats').textContent = totalEv + ' raw events total.';
  } else {
    const st = DATE_STATS[currentDate];
    if (st) {
      document.getElementById('footerDate').textContent = fullLabel + ', ';
      document.getElementById('footerStats').textContent = st.total + ' raw events, ' + st.qualifying + ' \u2265 10 mph.';
    } else {
      document.getElementById('footerDate').textContent = fullLabel;
      document.getElementById('footerStats').textContent = ' \u2014 no data.';
    }
  }
}

function renderEndDate() {
  const { day, label } = parseDateLabel(endDate);
  document.getElementById('endDateDayname').textContent = day;
  document.getElementById('endDateFmt').textContent = label;
  document.getElementById('prevEndDay').disabled = endDate <= currentDate;
  document.getElementById('nextEndDay').disabled = endDate >= AVAILABLE_DATES[AVAILABLE_DATES.length - 1];
}

function setDate(dateStr) {
  currentDate = dateStr;
  if (AVAILABLE_DATES.includes(dateStr)) {
    LEAF = ALL_LEAVES[dateStr];
    deriveAndPrecompute();
  }
  renderDateNav();

}

/* ── limit line plugin ──────────────────────────────────────────── */
const limitLinePlugin = {
  id: 'limitLine',
  afterDatasetsDraw(chart) {
    const meta = chart.getDatasetMeta(LIMIT_BAND_INDEX);
    if (!meta || meta.hidden) return;
    const ctx = chart.ctx;
    ctx.save();
    ctx.beginPath();
    if (meta.dataset && typeof meta.dataset.path === 'function') {
      meta.dataset.path(ctx);
    } else {
      meta.data.forEach((pt, i) => i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y));
    }
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--limit').trim() || '#1a1a1a';
    ctx.stroke();
    ctx.restore();
  }
};

/* ── full-day bar chart plugins ─────────────────────────────────── */
const limitLineDayPlugin = {
  id: 'limitLineDay',
  afterDatasetsDraw(chart) {
    const xScale = chart.scales.x;
    const x2 = xScale.getPixelForValue(LIMIT_BAND_INDEX);
    const x3 = xScale.getPixelForValue(LIMIT_BAND_INDEX + 1);
    const xLine = (x2 + x3) / 2;
    const { top, bottom } = chart.chartArea;
    const ctx = chart.ctx;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(xLine, top);
    ctx.lineTo(xLine, bottom);
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--limit').trim() || '#1a1a1a';
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '10px ' + (getComputedStyle(document.documentElement).getPropertyValue('--mono').trim() || 'monospace');
    ctx.fillStyle = ctx.strokeStyle;
    ctx.textAlign = 'left';
    ctx.fillText('25 MPH LIMIT', xLine + 6, top + 13);
    ctx.restore();
  }
};

const barLabelsPlugin = {
  id: 'barLabels',
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx;
    const ds = chart.data.datasets[0];
    chart.getDatasetMeta(0).data.forEach((bar, i) => {
      const v = ds.data[i];
      if (!v) return;
      ctx.save();
      ctx.font = '600 11px ' + (getComputedStyle(document.documentElement).getPropertyValue('--body').trim() || 'sans-serif');
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#1a1a1a';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(Math.round(v) + '%', bar.x, bar.y - 3);
      ctx.restore();
    });
  }
};

function renderCompareHour(dir, path) {
  const fn = (d, p, pk) => isSpanMode ? getSpanSpeedData(d, p, pk) : getSpeedData(d, p, pk);
  const toHourly = data => Array(24).fill(0).map((_, h) => data.reduce((s, b) => s + b.counts[h], 0));
  let hourA, hourB, labelA, labelB;

  if (compareDimension === 'direction') {
    hourA = toHourly(fn('etw', path, currentParking));
    hourB = toHourly(fn('wte', path, currentParking));
    labelA = 'W ← E'; labelB = 'W → E';
  } else if (compareDimension === 'path') {
    hourA = toHourly(fn(dir, 'straight', currentParking));
    hourB = toHourly(fn(dir, 'turning',  currentParking));
    labelA = 'Straight'; labelB = 'Turning';
  } else if (compareDimension === 'date') {
    hourA = isSpanMode
      ? toHourly(getSpanSpeedData(dir, path, currentParking))
      : toHourly(getSpeedDataForDate(currentDate, dir, path, currentParking));
    hourB = isSpanModeB
      ? toHourly(getSpanSpeedDataForDates(compareDateB, compareEndDateB || compareDateB, dir, path, currentParking))
      : toHourly(getSpeedDataForDate(compareDateB, dir, path, currentParking));
    labelA = parseDateLabel(currentDate).fullLabel;
    labelB = parseDateLabel(compareDateB).fullLabel;
  } else if (compareDimension === 'daytype') {
    hourA = toHourly(getSpanDataForDayType('weekdays', dir, path, currentParking));
    hourB = toHourly(getSpanDataForDayType('weekends', dir, path, currentParking));
    labelA = 'Weekdays'; labelB = 'Weekends';
  } else {
    const allD = fn(dir, path, 'all');
    const pkD  = fn(dir, path, 'parked');
    hourB = toHourly(pkD);
    hourA = toHourly(allD).map((v, h) => v - hourB[h]);
    labelA = 'Clear'; labelB = 'Parked nearby';
  }

  chartHourCompare.data.datasets[0].label = labelA;
  chartHourCompare.data.datasets[1].label = labelB;
  chartHourCompare.data.datasets[0].data  = hourA;
  chartHourCompare.data.datasets[1].data  = hourB;
  chartHourCompare.options.scales.y.max   = Math.ceil(Math.max(10, ...hourA, ...hourB) * 1.1);
  chartHourCompare.update();
}

function renderCompareDayGrouped(dir, path) {
  let countsA, countsB, labelA, labelB;
  const bandSums = data => data.map(b => sumArr(b.counts));

  if (compareDimension === 'direction') {
    countsA = bandSums(isSpanMode ? getSpanSpeedData('etw', path, currentParking) : getSpeedData('etw', path, currentParking));
    countsB = bandSums(isSpanMode ? getSpanSpeedData('wte', path, currentParking) : getSpeedData('wte', path, currentParking));
    labelA = 'W ← E'; labelB = 'W → E';
  } else if (compareDimension === 'path') {
    countsA = bandSums(isSpanMode ? getSpanSpeedData(dir, 'straight', currentParking) : getSpeedData(dir, 'straight', currentParking));
    countsB = bandSums(isSpanMode ? getSpanSpeedData(dir, 'turning',  currentParking) : getSpeedData(dir, 'turning',  currentParking));
    labelA = 'Straight'; labelB = 'Turning';
  } else if (compareDimension === 'date') {
    const dataA = isSpanMode
      ? getSpanSpeedData(dir, path, currentParking)
      : getSpeedDataForDate(currentDate, dir, path, currentParking);
    const dataB = isSpanModeB
      ? getSpanSpeedDataForDates(compareDateB, compareEndDateB || compareDateB, dir, path, currentParking)
      : getSpeedDataForDate(compareDateB, dir, path, currentParking);
    countsA = bandSums(dataA); countsB = bandSums(dataB);
    labelA = parseDateLabel(currentDate).fullLabel;
    labelB = parseDateLabel(compareDateB).fullLabel;
  } else if (compareDimension === 'daytype') {
    countsA = bandSums(getSpanDataForDayType('weekdays', dir, path, currentParking));
    countsB = bandSums(getSpanDataForDayType('weekends', dir, path, currentParking));
    labelA = 'Weekdays'; labelB = 'Weekends';
  } else {
    const allD = isSpanMode ? getSpanSpeedData(dir, path, 'all') : getSpeedData(dir, path, 'all');
    const pkD  = isSpanMode ? getSpanSpeedData(dir, path, 'parked') : getSpeedData(dir, path, 'parked');
    countsB = bandSums(pkD);
    countsA = bandSums(allD).map((v, i) => v - countsB[i]);
    labelA = 'Clear'; labelB = 'Parked nearby';
  }

  const totalA = countsA.reduce((s, v) => s + v, 0);
  const totalB = countsB.reduce((s, v) => s + v, 0);
  const pctA = countsA.map(v => totalA ? (v / totalA) * 100 : 0);
  const pctB = countsB.map(v => totalB ? (v / totalB) * 100 : 0);
  chartDayCompare.data.datasets[0].label = labelA;
  chartDayCompare.data.datasets[1].label = labelB;
  compareDayCountsA = countsA;
  compareDayCountsB = countsB;
  chartDayCompare.data.datasets[0].data = pctA;
  chartDayCompare.data.datasets[1].data = pctB;
  chartDayCompare.data.datasets[2].data = pctA;
  chartDayCompare.data.datasets[3].data = pctB;
  chartDayCompare.data.datasets[2].hidden = true;
  chartDayCompare.data.datasets[3].hidden = true;
  chartDayCompare.update();
}

let currentView = 'hour';
let dayBandCounts = Array(BANDS.length).fill(0);
let compareDayCountsA = Array(BANDS.length).fill(0);
let compareDayCountsB = Array(BANDS.length).fill(0);

function renderFullDay(dir, path, parking) {
  const data = isSpanMode
    ? getSpanSpeedData(dir, path, parking)
    : getSpeedData(dir, path, parking);
  dayBandCounts = data.map(b => sumArr(b.counts));
  const total = dayBandCounts.reduce((a, b) => a + b, 0);
  chartDay.data.datasets[0].data = dayBandCounts.map(v => total ? (v / total) * 100 : 0);
  chartDay.update();
}

/* ── update ─────────────────────────────────────────────────────── */
function applyFilters() {
  const active = isSpanMode ? getActiveDates() : null;
  const hasData = isSpanMode ? active.length > 0 : AVAILABLE_DATES.includes(currentDate);
  document.getElementById('noData').classList.toggle('visible', !hasData);

  const isHour = currentView === 'hour';
  document.getElementById('chart').style.display            = (!isCompareMode && isHour)   ? '' : 'none';
  document.getElementById('chartDay').style.display         = (!isCompareMode && !isHour)  ? '' : 'none';
  document.getElementById('chartHourCompare').style.display = (isCompareMode  && isHour)   ? '' : 'none';
  document.getElementById('chartDayCompare').style.display  = (isCompareMode  && !isHour)  ? '' : 'none';

  if (!hasData) {
    BANDS.forEach((_, i) => { chart.data.datasets[i].data = Array(24).fill(0); });
    chart.update();
    renderStats(currentDir, currentPath, currentParking);
    renderLegend(currentDir, currentPath, currentParking);
    return;
  }

  if (isCompareMode && isHour) {
    renderCompareHour(currentDir, currentPath);
    renderStats(currentDir, currentPath, 'all');
    renderLegend(currentDir, currentPath, currentParking);
  } else if (isCompareMode && !isHour) {
    renderCompareDayGrouped(currentDir, currentPath);
    renderStats(currentDir, currentPath, 'all');
    renderLegend(currentDir, currentPath, currentParking);
  } else {
    chart.options.scales.y.max = computeYMax();
    const data = isSpanMode
      ? getSpanSpeedData(currentDir, currentPath, currentParking)
      : getSpeedData(currentDir, currentPath, currentParking);
    data.forEach((b, i) => { chart.data.datasets[i].data = b.counts; });
    chart.update();
    renderFullDay(currentDir, currentPath, currentParking);
    renderStats(currentDir, currentPath, currentParking);
    renderLegend(currentDir, currentPath, currentParking);
  }
}

function animateArrows() {
  document.querySelectorAll('.dir-arrow').forEach(el => {
    el.classList.remove('animate');
    void el.getBoundingClientRect();
  });
  const dirs = currentDir === 'both' ? ['etw', 'wte'] : [currentDir];
  dirs.forEach(dir => {
    document.querySelectorAll(`#${dir}-arrows .dir-arrow`).forEach(el => {
      const straight = el.classList.contains('path-straight');
      const turning  = el.classList.contains('path-turning');
      if (currentPath === 'all' ||
          (currentPath === 'straight' && straight) ||
          (currentPath === 'turning'  && turning)) {
        el.classList.add('animate');
      }
    });
  });
}

function exitCompareMode() {
  // Restore Dataset B (the more recent one) as the active dataset
  if (compareDimension === 'date' && compareDateB) {
    currentDate = compareDateB;
    if (isSpanModeB) {
      endDate    = compareEndDateB || compareDateB;
      isSpanMode = true;
      document.getElementById('dateNav').classList.add('span-mode');
    } else {
      isSpanMode = false;
      document.getElementById('dateNav').classList.remove('span-mode');
    }
    if (AVAILABLE_DATES.includes(currentDate)) { LEAF = ALL_LEAVES[currentDate]; deriveAndPrecompute(); }
    renderDateNav();
    if (isSpanMode) renderEndDate();
  }

  isCompareMode = false;
  compareDimension = null;
  compareDateB = null;
  compareEndDateB = null;
  isSpanModeB = false;
  document.getElementById('dateNavB').classList.remove('span-mode');
  ['compareBtn','dirToggle','pathToggle','parkingToggle','dateLabel','endDateLabel'].forEach(id =>
    document.getElementById(id).classList.remove('compare-active'));
  setPresetHalos(false);
  document.querySelectorAll('#spanPresets .preset-btn[data-days]').forEach(btn =>
    btn.classList.remove('compare-selected'));
  document.querySelectorAll('.daytype-btn').forEach(btn => {
    btn.classList.remove('compare-selected');
    btn.classList.toggle('active', btn.dataset.daytype === currentDayType);
  });
  document.getElementById('compareCancelBtn').style.display = 'none';
  document.getElementById('neighborhoodMap').style.display = '';
  document.getElementById('dateCompareSelector').style.display = 'none';
  document.querySelectorAll('#dirToggle button').forEach(btn => {
    btn.classList.remove('compare-selected');
    btn.classList.toggle('active', btn.dataset.dir === currentDir);
  });
  document.querySelectorAll('#pathToggle button').forEach(btn => {
    btn.classList.remove('compare-selected');
    btn.classList.toggle('active', btn.dataset.path === currentPath);
  });
  document.querySelectorAll('#parkingToggle button').forEach(btn => {
    btn.classList.remove('compare-selected');
    btn.classList.toggle('active', btn.dataset.parking === currentParking);
  });
  applyFilters();
}

function activateCompareSpan() {
  compareDimension = 'date';
  ['compareBtn','dirToggle','pathToggle','parkingToggle','dateLabel','endDateLabel'].forEach(id =>
    document.getElementById(id).classList.remove('compare-active'));
  setPresetHalos(false);
  document.getElementById('compareCancelBtn').style.display = 'flex';
  document.getElementById('neighborhoodMap').style.display = 'none';
  document.getElementById('dateCompareSelector').style.display = 'flex';

  // Promote current span to Dataset B; shift Dataset A back by the same length
  const bStart   = currentDate;
  const bEnd     = endDate;
  const [by,bm,bd] = bStart.split('-').map(Number);
  const [ey,em,ed] = bEnd.split('-').map(Number);
  const spanDays = Math.round((new Date(ey,em-1,ed) - new Date(by,bm-1,bd)) / 86400000) + 1;
  const aEnd     = addDays(bStart, -1);
  const aStart   = addDays(aEnd, -(spanDays - 1));

  compareDateB    = bStart;
  compareEndDateB = bEnd;
  isSpanModeB     = true;

  currentDate = aStart < AVAILABLE_DATES[0] ? AVAILABLE_DATES[0] : aStart;
  endDate     = aEnd;
  if (AVAILABLE_DATES.includes(currentDate)) { LEAF = ALL_LEAVES[currentDate]; deriveAndPrecompute(); }

  renderDateNav();
  renderEndDate();
  renderDateNavB();
  renderStatsB();
  applyFilters();
  syncDateBLayout();
}

document.getElementById('compareBtn').addEventListener('click', () => {
  if (isCompareMode) { exitCompareMode(); return; }
  isCompareMode = true;
  ['compareBtn','dirToggle','pathToggle','parkingToggle','dateLabel'].forEach(id =>
    document.getElementById(id).classList.add('compare-active'));
  if (isSpanMode) {
    setPresetHalos(true);
    document.getElementById('endDateLabel').classList.add('compare-active');
  }
  // Leave all selections unchanged — halo signals pending state
});

function renderDateNavB() {
  if (!compareDateB) return;
  const { day, label } = parseDateLabel(compareDateB);
  document.getElementById('dateDaynameB').textContent = day;
  document.getElementById('dateFmtB').textContent = label;
  if (isSpanModeB && compareEndDateB) {
    const e = parseDateLabel(compareEndDateB);
    document.getElementById('endDateDaynameB').textContent = e.day;
    document.getElementById('endDateFmtB').textContent = e.label;
  }
  document.getElementById('dateNavB').classList.toggle('span-mode', isSpanModeB);
}

function renderStatsB() {
  const statsEl = document.getElementById('statsB');
  if (!statsEl) return;
  statsEl.innerHTML = '';
  let cards;
  if (isSpanModeB) {
    const endB = compareEndDateB || compareDateB;
    const data = getSpanSpeedDataForDates(compareDateB, endB, currentDir, currentPath, currentParking);
    const total = data.reduce((a, b) => a + sumArr(b.counts), 0);
    const over  = data.slice(LIMIT_BAND_INDEX + 1).reduce((a, b) => a + sumArr(b.counts), 0);
    const pct   = total ? Math.round((over / total) * 100) : 0;
    const n     = AVAILABLE_DATES.filter(d => d >= compareDateB && d <= endB).length;
    cards = [
      { k: 'Events counted', v: total, note: n + (n === 1 ? ' day' : ' days') + ' total' },
      { k: 'Over the limit', v: pct + '%', note: over + ' of ' + total + ' traffic events', alert: true },
    ];
  } else {
    const data = getSpeedDataForDate(compareDateB, currentDir, currentPath, currentParking);
    const total = data.reduce((a, b) => a + sumArr(b.counts), 0);
    const over  = data.slice(LIMIT_BAND_INDEX + 1).reduce((a, b) => a + sumArr(b.counts), 0);
    const pct   = total ? Math.round((over / total) * 100) : 0;
    cards = [
      { k: 'Events counted', v: total, note: '≥ 10 mph, full day' },
      { k: 'Over the limit', v: pct + '%', note: over + ' of ' + total + ' traffic events', alert: true },
    ];
  }
  cards.forEach(s => {
    const el = document.createElement('div');
    el.className = 'stat' + (s.alert ? ' alert' : '');
    el.innerHTML = '<p class="k">' + s.k + '</p><p class="v">' + s.v + '</p><p class="note">' + s.note + '</p>';
    statsEl.appendChild(el);
  });
}

function syncDateBLayout() {
  if (compareDimension !== 'date') return;
  const headerSpacer = document.getElementById('dateCmpHeaderSpacer');
  const presetSpacer = document.getElementById('dateCmpPresetsSpacer');
  if (headerSpacer) headerSpacer.style.height = '0';
  if (presetSpacer) presetSpacer.style.height = '0';
  requestAnimationFrame(() => {
    const navA   = document.getElementById('dateNav');
    const statsA = document.getElementById('stats');
    const navB   = document.getElementById('dateNavB');
    const statsB = document.getElementById('statsB');
    if (!navA || !statsA || !navB || !statsB) return;
    const navATop   = navA.getBoundingClientRect().top;
    const statsATop = statsA.getBoundingClientRect().top;
    const navBTop   = navB.getBoundingClientRect().top;
    const statsBTop = statsB.getBoundingClientRect().top;
    const headerAdj = Math.max(0, navATop - navBTop);
    const statsAdj  = Math.max(0, (statsATop - statsBTop) - headerAdj);
    if (headerSpacer) headerSpacer.style.height = headerAdj + 'px';
    if (presetSpacer) presetSpacer.style.height = statsAdj + 'px';
  });
}

function activateCompareDateMode() {
  compareDimension = 'date';
  ['compareBtn','dirToggle','pathToggle','parkingToggle','dateLabel','endDateLabel'].forEach(id =>
    document.getElementById(id).classList.remove('compare-active'));
  setPresetHalos(false);
  document.getElementById('compareCancelBtn').style.display = 'flex';
  document.getElementById('neighborhoodMap').style.display = 'none';
  document.getElementById('dateCompareSelector').style.display = 'flex';

  if (!compareDateB) {
    // Date B (right) = current date; Date A (left) = one step back
    compareDateB = currentDate;
    compareEndDateB = compareDateB;
    const idx = AVAILABLE_DATES.indexOf(currentDate);
    if (idx > 0) {
      currentDate = AVAILABLE_DATES[idx - 1];
      if (AVAILABLE_DATES.includes(currentDate)) { LEAF = ALL_LEAVES[currentDate]; deriveAndPrecompute(); }
      renderDateNav();
    }
  }
  renderDateNavB();
  renderStatsB();
  applyFilters();
  syncDateBLayout();
}

// Mobile: cycle-arrow buttons step through a toggle group's existing buttons,
// re-firing the same click handling those buttons already have.
document.querySelectorAll('.cycle-arrow').forEach(arrow => {
  arrow.addEventListener('click', () => {
    const toggle = document.getElementById(arrow.dataset.cycle);
    const buttons = Array.from(toggle.querySelectorAll('button'));
    const curIdx = buttons.findIndex(b => b.classList.contains('active'));
    const step = parseInt(arrow.dataset.cycleStep, 10);
    const nextIdx = (curIdx + step + buttons.length) % buttons.length;
    buttons[nextIdx].click();
  });
});

  currentDayType = 'all';
  document.getElementById('dateNav').classList.remove('span-mode');
  document.querySelectorAll('.daytype-btn').forEach(b => b.classList.remove('active'));
  setPresetHalos(false);
  document.getElementById('endDateLabel').classList.remove('compare-active');
  document.querySelectorAll('#spanPresets .preset-btn[data-days]').forEach(btn =>
    btn.classList.remove('compare-selected'));
  renderDateNav();
  applyFilters();
});
document.getElementById('prevEndDay').addEventListener('click', () => {
  const prev = addDays(endDate, -1);
  if (prev >= currentDate) setEndDate(prev);
});
document.getElementById('nextEndDay').addEventListener('click', () => {
  const next = addDays(endDate, 1);
  if (next <= AVAILABLE_DATES[AVAILABLE_DATES.length - 1]) setEndDate(next);
});
document.getElementById('endDateLabel').addEventListener('click', () => {
  const picker = document.getElementById('endDatePicker');
  picker.value = endDate;
  picker.min = currentDate;
  picker.max = AVAILABLE_DATES[AVAILABLE_DATES.length - 1];
  picker.showPicker();
});
document.getElementById('endDatePicker').addEventListener('change', e => {
  setEndDate(e.target.value);
});

function activateComparePreset(n, clickedBtn) {
  compareDimension = 'date';
  ['compareBtn','dirToggle','pathToggle','parkingToggle','dateLabel','endDateLabel'].forEach(id =>
    document.getElementById(id).classList.remove('compare-active'));
  setPresetHalos(false);
  document.querySelectorAll('#spanPresets .preset-btn[data-days]').forEach(btn =>
    btn.classList.remove('compare-selected'));
  clickedBtn.classList.add('compare-selected');
  document.getElementById('compareCancelBtn').style.display = 'flex';
  document.getElementById('neighborhoodMap').style.display = 'none';
  document.getElementById('dateCompareSelector').style.display = 'flex';

  const lastDate = AVAILABLE_DATES[AVAILABLE_DATES.length - 1];
  // Date B (right, more recent): last N calendar days
  const bEnd   = lastDate;
  const bStart = addDays(lastDate, -(n - 1));
  // Date A (left, older): the N calendar days immediately before that
  const aEnd   = addDays(bStart, -1);
  const aStart = addDays(aEnd,   -(n - 1));

  currentDate = aStart < AVAILABLE_DATES[0] ? AVAILABLE_DATES[0] : aStart;
  endDate     = aEnd;
  if (AVAILABLE_DATES.includes(currentDate)) {
    LEAF = ALL_LEAVES[currentDate];
    deriveAndPrecompute();
  }
  compareDateB    = bStart < AVAILABLE_DATES[0] ? AVAILABLE_DATES[0] : bStart;
  compareEndDateB = bEnd;
  isSpanModeB     = true;

  renderDateNav();
  renderEndDate();
  renderDateNavB();
  renderStatsB();
  applyFilters();
  syncDateBLayout();
}

function activateCompareDaytype(chosen, clickedBtn) {
  compareDimension = 'daytype';
  ['compareBtn','dirToggle','pathToggle','parkingToggle','dateLabel','endDateLabel'].forEach(id =>
    document.getElementById(id).classList.remove('compare-active'));
  setPresetHalos(false);
  document.querySelectorAll('.daytype-btn').forEach(btn => { btn.classList.remove('active'); btn.classList.add('compare-selected'); });
  document.getElementById('compareCancelBtn').style.display = 'flex';
  document.getElementById('neighborhoodMap').style.display = '';
  document.getElementById('dateCompareSelector').style.display = 'none';
  applyFilters();
}

document.getElementById('spanPresets').addEventListener('click', e => {
  const btn = e.target.closest('.preset-btn');
  if (!btn) return;
  if (btn.dataset.daytype) {
    const chosen = btn.dataset.daytype;
    if (isCompareMode && isSpanMode) {
      activateCompareDaytype(chosen, btn);
      return;
    }
    currentDayType = currentDayType === chosen ? 'all' : chosen;
    document.querySelectorAll('.daytype-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.daytype === currentDayType));
    applyFilters();
    return;
  }
  const n = parseInt(btn.dataset.days);
  if (isCompareMode) {
    activateComparePreset(n, btn);
    return;
  }
  const last = AVAILABLE_DATES[AVAILABLE_DATES.length - 1];
  const start = addDays(last, -(n - 1));
  currentDate = start < AVAILABLE_DATES[0] ? AVAILABLE_DATES[0] : start;
  endDate = last;
  if (AVAILABLE_DATES.includes(currentDate)) {
    LEAF = ALL_LEAVES[currentDate];
    deriveAndPrecompute();
  }
  renderDateNav();
  renderEndDate();
  applyFilters();
});

/* ── init ─────────────────────────────────────────────────────────── */
renderDateNav();
renderEndDate();
renderStats('both', 'all', 'all');
renderLegend('both', 'all', 'all');

new ResizeObserver(() => syncDateBLayout()).observe(document.body);
</script>
